
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Notifikasi Peminjaman</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .terima {
            background: #16a34a;
            color: white;
        }

        .tolak {
            background: #dc2626;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Notifikasi Peminjaman</h2>

        <p id="status">Status: Menunggu konfirmasi</p>

        <button class="terima" onclick="ubahStatus('Disetujui')">
            Setujui
        </button>

        <button class="tolak" onclick="ubahStatus('Ditolak')">
            Tolak
        </button>

        <p id="pesan"></p>
    </div>

    <script>
        function ubahStatus(status) {
            document.getElementById("status").textContent =
                "Status: " + status;

            document.getElementById("pesan").textContent =
                status === "Disetujui"
                ? "Notifikasi: Peminjaman ruangan berhasil disetujui!"
                : "Notifikasi: Pengajuan peminjaman ditolak.";
        }
    </script>
</body>
</html>
